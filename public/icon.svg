* {
  box-sizing: border-box;
}

:root {
  --bg: #05070b;
  --panel: rgba(17, 21, 27, 0.9);
  --panel-alt: rgba(19, 23, 30, 0.96);
  --line: rgba(255, 211, 97, 0.7);
  --text: #f2f4f7;
  --muted: #a3b2c4;
  --primary: #f6d56a;
  --primary-strong: #f0b728;
  --success: #60d38e;
  --danger: #ff7d6d;
  --warning: #ffb84f;
  --purple: #b086ff;
  --shadow: rgba(0, 0, 0, 0.34);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, rgba(246, 213, 106, 0.12), transparent 16%), var(--bg);
  color: var(--text);
  font-family: Inter, 'Segoe UI', sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 12px;
  padding: 0.8rem 1rem;
  transition: transform 0.18s ease, opacity 0.18s ease;
}

button:hover {
  transform: translateY(-1px);
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.02);
  color: var(--text);
  border-radius: 12px;
  padding: 0.8rem 0.9rem;
  outline: none;
}

input::placeholder,
textarea::placeholder {
  color: rgba(255, 255, 255, 0.45);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

.app-shell {
  min-height: 100vh;
  padding: 1rem;
}

.topbar {
  max-width: 1400px;
  margin: 0 auto 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  background: rgba(12, 16, 20, 0.85);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 18px 35px var(--shadow);
  padding: 1rem 1.25rem;
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 0.9rem;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), #d29732);
  color: #1c1c1c;
  font-weight: 800;
  font-size: 1.5rem;
}

.eyebrow {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

h1 {
  margin: 0.2rem 0 0;
  font-size: clamp(1.4rem, 3vw, 2.1rem);
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  flex-wrap: wrap;
}

.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-strong));
  color: #1c1c1c;
  font-weight: 700;
}

.outline {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text);
}

.gold {
  background: linear-gradient(135deg, #f6d56a, #e7a63d);
  color: #1a1203;
  font-weight: 700;
}

.notification-pill {
  min-width: 68px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.65rem 0.9rem;
}

.workspace {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 1rem;
}

.sidebar,
.main-panel {
  min-width: 0;
}

.sidebar {
  background: rgba(16, 21, 28, 0.8);
  border: 1px solid rgba(255, 211, 97, 0.1);
  border-radius: 22px;
  padding: 1rem;
}

.nav-stack {
  display: grid;
  gap: 0.6rem;
}

.nav-item {
  text-align: left;
  background: transparent;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 0.8rem 0.9rem;
}

.nav-item.active {
  background: rgba(246, 213, 106, 0.08);
  border-color: rgba(246, 213, 106, 0.25);
}

.mini-card,
.panel-card {
  background: rgba(15, 19, 25, 0.92);
  border: 1px solid rgba(255, 211, 97, 0.1);
  border-radius: 20px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
}

.mini-card {
  margin-top: 1rem;
  padding: 1rem;
}

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.55rem;
  margin-top: 0.75rem;
}

.quick-grid button {
  background: rgba(255, 255, 255, 0.02);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.main-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.hero-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1rem;
}

.hero-card {
  background: rgba(18, 22, 29, 0.88);
  border: 1px solid rgba(255, 211, 97, 0.08);
  border-radius: 20px;
  padding: 1rem 1rem 1.2rem;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.summary-card span {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.summary-card strong {
  font-size: clamp(1.2rem, 4vw, 2rem);
}

.summary-card.positive { border-color: rgba(96, 211, 142, 0.45); }
.summary-card.negative { border-color: rgba(255, 125, 109, 0.45); }
.summary-card.green { border-color: rgba(96, 211, 142, 0.45); }
.summary-card.amber { border-color: rgba(255, 184, 79, 0.45); }
.summary-card.purple { border-color: rgba(176, 134, 255, 0.45); }
.summary-card.orange { border-color: rgba(255, 153, 80, 0.45); }

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.widget {
  padding: 1rem;
}

.widget.wide {
  grid-column: span 2;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.8rem;
}

.section-header h3 {
  margin: 0;
  font-size: 1.15rem;
}

.transaction-list,
.list-compact {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.7rem;
}

.transaction-list li,
.list-compact li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  padding: 0.75rem 0.8rem;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 14px;
}

.transaction-list strong,
.person-card strong {
  display: block;
}

.transaction-list small,
.person-card small,
.list-compact {
  color: var(--muted);
}

.amount-group {
  text-align: right;
  display: grid;
  gap: 0.2rem;
}

.pos { color: var(--success); }
.neg { color: var(--danger); }

.stat-badges {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.8rem;
}

.badge {
  display: inline-flex;
  padding: 0.45rem 0.7rem;
  border-radius: 999px;
  font-size: 0.75rem;
}

.badge.danger { background: rgba(255, 125, 109, 0.1); color: var(--danger); }
.badge.warn { background: rgba(255, 184, 79, 0.1); color: var(--warning); }

.month-chart {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 1rem;
  align-items: end;
  min-height: 160px;
  margin-top: 0.75rem;
}

.month-bar-group {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 0.5rem;
  min-height: 140px;
}

.month-label {
  color: var(--muted);
  font-size: 0.74rem;
}

.bar-stack {
  width: 100%;
  height: 120px;
  display: flex;
  align-items: flex-end;
  gap: 0.25rem;
  justify-content: center;
}

.bar {
  display: block;
  width: 22%;
  min-height: 16px;
  border-radius: 8px 8px 0 0;
}

.bar.lent { background: linear-gradient(180deg, #7ce7aa, #379d5f); }
.bar.recv { background: linear-gradient(180deg, #f4d775, #d39e00); }

.two-column-grid {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 1rem;
}

.panel-card {
  padding: 1rem;
}

.stack-form {
  display: grid;
  gap: 0.8rem;
}

.inline-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.7rem;
}

.person-list {
  display: grid;
  gap: 0.8rem;
}

.person-card {
  padding: 0.9rem;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 16px;
}

.person-header {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

.avatar {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-strong));
  color: #121212;
  font-weight: 800;
}

.mini-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin: 0.9rem 0;
  color: var(--muted);
  font-size: 0.8rem;
}

.actions-row,
.button-row {
  display: flex;
  gap: 0.7rem;
  flex-wrap: wrap;
}

.record-summary-box {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.75rem 0.8rem;
  border-radius: 12px;
  background: rgba(246, 213, 106, 0.08);
  color: var(--text);
  font-size: 0.9rem;
}

.notification-stack {
  display: grid;
  gap: 0.8rem;
}

.notification-item {
  padding: 0.9rem;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.notification-item.read {
  opacity: 0.72;
}

.notification-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.7rem;
  margin-bottom: 0.4rem;
}

.notification-item p {
  margin: 0.2rem 0 0.8rem;
  color: var(--muted);
}

.message-panel {
  display: grid;
  gap: 1rem;
}

.message-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.8rem;
}

.settings-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.settings-card label {
  display: grid;
  gap: 0.45rem;
  color: var(--muted);
}

.switch-row {
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 0.9rem;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.02);
}

.switch-row input {
  width: 20px;
  height: 20px;
}

.alert-banner {
  max-width: 1400px;
  margin: 0 auto 1rem;
  background: rgba(246, 213, 106, 0.08);
  border: 1px solid rgba(246, 213, 106, 0.25);
  color: var(--text);
  border-radius: 14px;
  padding: 0.8rem 1rem;
}

@media (max-width: 980px) {
  .workspace {
    grid-template-columns: 1fr;
  }

  .two-column-grid,
  .dashboard-grid,
  .settings-grid,
  .hero-row,
  .message-controls {
    grid-template-columns: 1fr;
  }

  .widget.wide {
    grid-column: auto;
  }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 520px) {
  .app-shell {
    padding: 0.7rem;
  }

  .quick-grid,
  .inline-inputs {
    grid-template-columns: 1fr;
  }

  .toolbar-actions {
    width: 100%;
  }

  .toolbar-actions > * {
    flex: 1 1 auto;
  }
}
